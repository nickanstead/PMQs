name: Update PMQs data

on:
  workflow_dispatch:
    inputs:
      start_year:
        description: "First year to process"
        default: "2024"
      end_year:
        description: "Last year to process"
        default: "2026"
      force:
        description: "Redo years that already have data"
        type: boolean
        default: false
  schedule:
    # Odd minutes, because GitHub's scheduler is most congested on the hour.
    - cron: "37 12 * * 4"  # Thursdays 12:37 UTC, the day after Wednesday PMQs
    - cron: "23 8 * * 5"   # Fridays 08:23 UTC, backstop in case Hansard was late

permissions:
  contents: write

# Both data workflows share one queue: a run that starts while another is
# going waits for it to finish, so their saves can't clash.
concurrency:
  group: pmqs-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Keep a copy of the current data for comparison
        run: cp -r data/pmqs /tmp/old_pmqs

      - name: Extract PMQs exchanges
        run: python -u scripts/extract_pmqs.py ${{ github.event.inputs.start_year }} ${{ github.event.inputs.end_year }} ${{ github.event.inputs.force == 'true' && '--force' || '' }}

      - name: Attach names and parties before 1997
        run: python -u scripts/enrich_parties.py

      - name: Compare with the previous data
        if: always()
        run: python -u scripts/compare_rebuild.py /tmp/old_pmqs "${{ github.event.inputs.start_year }}-${{ github.event.inputs.end_year }}"

      - name: Commit new data
        if: always()   # save finished years even if a later one fails
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p data/standins data/reports
          git add data/pmqs data/standins data/diagnostics data/reports data/reference
          git diff --cached --quiet || git commit -m "Update PMQs data"
          git push
