name: Update PMQs data

on:
  workflow_dispatch:
    inputs:
      start_year:
        description: "First year to process"
        default: "2024"
      end_year:
        description: "Last year to process"
        default: "2026"
      force:
        description: "Redo years that already have data"
        type: boolean
        default: false
  schedule:
    - cron: "0 12 * * 4"   # Thursdays 12:00 UTC, the day after Wednesday PMQs
    - cron: "0 8 * * 5"    # Fridays 08:00 UTC, backstop in case Hansard was late

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Extract PMQs exchanges
        run: python -u scripts/extract_pmqs.py ${{ github.event.inputs.start_year }} ${{ github.event.inputs.end_year }} ${{ github.event.inputs.force == 'true' && '--force' || '' }}

      - name: Commit new data
        if: always()   # save finished years even if a later one fails
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/pmqs data/diagnostics
          git diff --cached --quiet || git commit -m "Update PMQs data"
          git push
